# Канон: https://lerk.tech на VPS метрики-ребенка (SSH metrika-rebenka, 157.22.231.158).
# На сервере: /etc/nginx/sites-available/site-lerk.tech, симлинк в sites-enabled с тем же именем.
#
# Публичный 443 держит Xray: h2 падает на 127.0.0.1:8081, остальное на :8082, оба с PROXY v2.
# listen обязан совпадать с vhost метрики и донну.рф, иначе nginx не поднимется.
# Имя файла начинается на site-, чтобы грузиться после metrika: у портов 80/8081/8082 нет
# default_server, запросы без известного Host (по IP, пробы витрины Happ) отдаёт первый vhost,
# и это должна остаться метрика.
#
# Сайт статичный: docroot /var/www/lerk.tech/repo/public, обновление git pull.

server {
    listen 80;
    listen [::]:80;
    server_name lerk.tech www.lerk.tech;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        allow all;
    }

    location / {
        return 301 https://lerk.tech$request_uri;
    }
}

server {
    listen 127.0.0.1:8081 proxy_protocol http2;
    listen 127.0.0.1:8082 proxy_protocol;
    server_name lerk.tech;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    root /var/www/lerk.tech/repo/public;
    index index.html;
    charset utf-8;
    error_page 404 /404.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        allow all;
    }

    location ~ /\.[^/] { deny all; }

    # Картинки и шрифты меняются редко. CSS и JS сбрасываются параметром ?v= в index.html
    location ^~ /assets/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/manifest+json application/xml text/plain;
}

server {
    listen 127.0.0.1:8081 proxy_protocol http2;
    listen 127.0.0.1:8082 proxy_protocol;
    server_name www.lerk.tech;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    location / {
        return 301 https://lerk.tech$request_uri;
    }
}
